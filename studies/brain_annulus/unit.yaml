# Brain-sized annulus (2D): pial circle of radius 6.5 cm at the origin, ventricle of radius
# 1.3 cm centred at (1.5 cm, 0). Tissue 6.7 cm thick at x < 0, 3.7 cm at x > 0.
# One unit load: a 1 Pa sine, common (C = 1: both walls) or difference (D = 1: ventricle only).
# run.py changes the parameters, the load, the pia and the time; alone, this is cvr22_fixed_Cc.
model: poro2
scales: {L0: 1.0e-2, T0: 1.0, P0: 1.0}
mesh:
  shape: annulus
  radius: 6.5e-2
  inner: {center: [1.5e-2, 0.0], radius: 1.3e-2}
  h: 3.0e-3                                        # bulk
  wall: {h: 1.0e-4, band: 2.0e-4, growth: 2.0e-3}  # walls: h = 4.5 delta (cvr22)
  names: {inner: ventricle, outer: pial}
material: {preset: cvr22}
params: {freq: 1.0, C: 1.0, D: 0.0}
loads:
  s: "sin(2*pi*freq*t)"     # starts from 0: no jump at t = 0
  pv: "(C + D) * s"         # ventricle
  pp: "C * s"               # pia
boundaries:
  ventricle: {pressure: pv, normal_traction: "-pv"}
  pial: {pressure: pp, displacement: [0, 0]}
discretization: {deg: 2, deg_p: 1}
time: {T: 3.0, dt: 0.01, theta: 0.5, newmark_beta: 0.3025, newmark_gamma: 0.6}   # damped Newmark: removes elastic ringing
output:
  boundary_flux: conservative         # 1. flow through each wall, every step
  fields:                             # 2-3. full fields at quarter periods: whole-slice maps
    quantities: [p, cflux, d]
    at: [2.25, 2.5, 2.75, 3.0]
  grid:                               # 2-3. 0.5 mm grid over the slice: bulk numbers
    n: 260
    quantities: [p, cflux]
    at: {from: 2.0, to: 3.0, every: 5}
  lines:                              # 4. 2 mm into the tissue from each wall, on the x axis
    quantities: [p, cflux]
    at: {from: 2.0, to: 3.0, every: 1}
    paths:
      pial_thick:      {from: [-0.064999, 0.0], to: [-0.062999, 0.0], n: 401}
      ventricle_thick: {from: [ 0.001999, 0.0], to: [-0.000001, 0.0], n: 401}
      ventricle_thin:  {from: [ 0.028001, 0.0], to: [ 0.030001, 0.0], n: 401}
      pial_thin:       {from: [ 0.064999, 0.0], to: [ 0.062999, 0.0], n: 401}