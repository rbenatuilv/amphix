# Mean transmantle difference plus an oscillation: pv = gamma + dP cos(2 pi t), p = 0 at the pia.
# dP = 194.6 Pa/m x 7.5 mm (cardiac transmantle gradient); gamma = dP / 5.
# pc is constant, so it is set to 0: with alpha = 1 a uniform pressure moves no fluid.
# The oscillation starts as a cosine: a sine has a net push over its first cycle, which leaves
# a slowly decaying drainage transient.
model: poro2
scales: {L0: 1.0e-2, T0: 1.0, P0: 1.0}
mesh:
  shape: annulus
  radius: 1.0e-2
  inner: {center: [3.0e-3, 0.0], radius: 2.5e-3}
  h: 5.0e-4
  wall: {h: 6.5e-5, band: 2.0e-4, growth: 1.0e-3}   # h = 3 delta at both walls
  names: {inner: ventricle, outer: pial}
material: {preset: cvr22}
params: {gamma: 0.292, dP: 1.4595}                   # Pa
loads:
  pv: "gamma + dP * cos(2*pi*t)"
boundaries:
  ventricle: {pressure: pv, normal_traction: "-pv"}
  pial: {pressure: 0, displacement: [0, 0]}
discretization: {deg: 2, deg_p: 1}
time: {T: 5.0, dt: 0.01, theta: 0.5}
output:
  boundary_flux: conservative