# 1D boundary-layer test: a strip pulsed at its left end (cvr22, 1 Hz).
# delta = sqrt(2 kappa / (omega S)) = 22.2 um; length L = 5 delta.
model: poro2
scales: {L0: 1.0e-4, T0: 1.0, P0: 1.0}
mesh:
  shape: rectangle
  corners: [[0.0, 0.0], [1.11e-4, 1.11e-5]]
  n: [20, 2]                       # the script varies the first number
material: {preset: cvr22}
params: {P: 1.0}                   # amplitude, Pa (linear: the value does not matter)
loads:
  pulse: "P * sin(2*pi*t)"         # starts from 0: no jump at t = 0
boundaries:
  left:   {pressure: pulse, traction: [0, 0]}      # pulsed end, zero total traction
  right:  {pressure: 0, displacement: [0, 0]}      # far end
  bottom: {flux: 0, roller: 0}                     # symmetry walls: the strip behaves as 1D
  top:    {flux: 0, roller: 0}
discretization: {deg: 2}
time: {T: 6.0, dt: 0.01, theta: 0.5}
output:
  lines: {axis: {from: [0.0, 5.55e-6], to: [1.11e-4, 5.55e-6], n: 201}}
  series: [p, cflux]
  snapshots: {from: 4.0, to: 6.0, every: 1}        # last two cycles, every step