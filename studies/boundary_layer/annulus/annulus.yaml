# Run A: the brain annulus pulsed at both walls, no internal source (cvr22, 1 Hz).
# The pressure boundary layer is delta = 22 um thick: the walls are refined to h_wall.
model: poro2
scales: {L0: 1.0e-2, T0: 1.0, P0: 100.0}
mesh:
  shape: annulus
  radius: 1.0e-2
  inner: {center: [3.0e-3, 0.0], radius: 2.5e-3}
  h: 5.0e-4
  wall: {h: 4.0e-5, band: 1.0e-4, growth: 1.0e-3}
  names: {inner: ventricle, outer: pial}
material: {preset: cvr22}
loads:
  pc: {waveform: cardiac_oscillation}       # zero-mean pulse, both walls
  dp: {waveform: transmantle}               # 194.6 Pa/m x 7.5 mm, ventricle only
  pv: "pc + dp"
boundaries:
  ventricle: {pressure: pv, normal_traction: "-pv"}
  pial: {pressure: pc, displacement: [0, 0]}
discretization: {deg: 2, deg_p: 1}
time: {T: 5.0, dt: 0.01, theta: 0.5}
output:
  lines:                                    # radial lines on the x axis, ~5 um spacing
    thick: {from: [-1.0e-2, 0.0], to: [5.0e-4, 0.0], n: 2101}
    thin: {from: [5.5e-3, 0.0], to: [1.0e-2, 0.0], n: 901}
  series: [p, cflux]
  snapshots: {from: 4.0, to: 5.0, every: 1}  # every step of the last cycle